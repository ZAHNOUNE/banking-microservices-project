server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        prefer-ip-address: true
        ip-address: 127.0.0.1
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - StripPrefix=1

        - id: ebank-service
          uri: lb://ebank-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1

        - id: ebank-chatbot-service
          uri: lb://ebank-chatbot-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway