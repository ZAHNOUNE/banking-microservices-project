name: Verification technique

on:
  push:
    branches:
      - main
      - feat/mcp-validation-evaluation-docs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - customer-service
          - account-service
          - api-gateway
          - ai-assistant-service
    defaults:
      run:
        working-directory: banking-platform/${{ matrix.module }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: banking-platform/**/pom.xml
      - name: Run Maven tests
        run: mvn -B -ntp test

  angular-build:
    name: Angular / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-platform/banking-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: banking-platform/banking-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
